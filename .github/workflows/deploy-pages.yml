name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required for pages write permission
permissions:
  contents: read
  pages:    write
  id-token: write

# Prevent overlapping deployments
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Rust + WASM toolchain ───────────────────────────────────────────────
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      # ── Node + pnpm ─────────────────────────────────────────────────────────
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build WASM (outputs to public/pkg/)
        run: wasm-pack build crates/sim-engine --target web --out-dir public/pkg --release

      - name: Build Vite bundle
        # BASE_URL is set to /<repo-name>/ so that the app works at
        # https://<owner>.github.io/<repo-name>/
        run: pnpm exec vite build --base /${{ github.event.repository.name }}/

      # ── Upload ──────────────────────────────────────────────────────────────
      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
