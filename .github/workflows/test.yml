name: Test Suite

on:
  push:
    branches: [main, develop, 'feat/**']
  pull_request:
    branches: [main]

jobs:
  # ── 1. Rust unit tests, clippy, fmt ─────────────────────────────────────────
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Run Rust tests
        run: cargo test -p sim-engine

      - name: Clippy (deny warnings)
        run: cargo clippy -p sim-engine -- -D warnings

      - name: Check formatting
        run: cargo fmt -p sim-engine --check

  # ── 2. JavaScript unit tests (Vitest + jsdom) ────────────────────────────────
  test-js:
    name: JavaScript Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest unit tests
        run: pnpm test

  # ── 3. Production build (WASM + Vite) ────────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: [test-rust, test-js]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build WASM
        run: wasm-pack build crates/sim-engine --target web --out-dir pkg --release

      # Copy WASM pkg into public/ so Vite can serve it and Playwright can load it
      - name: Stage WASM for Vite
        run: cp -r crates/sim-engine/pkg public/pkg

      - name: Build Vite bundle
        run: pnpm exec vite build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── 4. Playwright E2E tests ───────────────────────────────────────────────────
  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Build WASM
        run: wasm-pack build crates/sim-engine --target web --out-dir pkg --release

      - name: Stage WASM for Vite
        run: cp -r crates/sim-engine/pkg public/pkg

      - name: Build Vite bundle (needed for vite preview)
        run: pnpm exec vite build

      - name: Run Playwright E2E tests
        run: pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
